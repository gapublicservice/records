name: Measure backfill report

# Re-reads the measure.json artifact from a Measure backfill run. No requests
# to the Commission's site.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Measure backfill run"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: measure-backfill
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python3 scripts/measure_report.py measure.json
