name: Publish the website

# Builds the static tracker site from the record and publishes it with
# GitHub Pages, after each nightly harvest, each EIA update, and any change
# to the site's code.
# Runs by hand only until Pages is turned on in the repository's settings
# (Settings, Pages, Source: GitHub Actions). Then the triggers below go back on:
#   push to main on site code; workflow_run after Nightly harvest, EIA, Backfill.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m harvester.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
