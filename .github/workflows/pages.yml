name: Publish the website

# Builds the static tracker site from the record and publishes it with
# GitHub Pages, after each nightly harvest, each EIA update, and any change
# to the site's code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["harvester/site.py", "legis/**", "site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Nightly harvest", "Georgia generator list from EIA", "Backfill", "Docket titles", "Commission agendas", "Legislature harvest"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m harvester.site
      - name: Bill pages
        # The newest regular session in the record, such as 2025_26 or 2027_28.
        run: |
          session=$(ls data/legislature | grep -E '^[0-9]{4}_[0-9]{2}$' | sort | tail -1)
          python -m legis.site "$session"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
