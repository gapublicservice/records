name: Meeting transcript

# Unofficial transcripts of Commission administrative sessions and committee
# meetings. YouTube turns away GitHub's runners, so the transcripts are made on
# Paul's own computer by tools/transcribe_meetings.py, which uploads one zip
# per meeting to inbox/transcripts/. This job checks each zip with
# "python -m harvester.meetings take" (meeting id, video title, plain YouTube
# address, audio fingerprint, line shape), copies what passes into
# data/meetings, and removes the zip from the inbox. The website then rebuilds.
on:
  push:
    branches: [main]
    paths: ["inbox/transcripts/**"]
  workflow_dispatch:

concurrency:
  group: meeting-transcript
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  take:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take checked transcripts from the inbox
        run: |
          shopt -s nullglob
          zips=(inbox/transcripts/*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "Inbox is empty."; exit 0; }
          for z in "${zips[@]}"; do
            echo "== $z"
            python -m harvester.meetings take "$z"
          done
          git config user.name "records-harvester"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q "${zips[@]}"
          git add data/meetings
          git commit -q -m "Meeting transcripts from the inbox (unofficial)"
          ok=0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && ok=1 && break; sleep $((i*10)); done
          [ "$ok" = 1 ]
