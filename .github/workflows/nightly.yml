name: Nightly harvest

on:
  schedule:
    - cron: "0 8 * * *"   # 3 AM Eastern standard time
  workflow_dispatch:
    inputs:
      seed:
        description: "Latest known filing number (first run only)"
        required: false
        default: "229480"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils antiword
      - run: pip install -q openpyxl
      - run: python -m unittest discover -s tests -t .
      - name: Harvest new filings
        run: python -m harvester.run nightly --seed "${{ github.event.inputs.seed || '229480' }}"
      - name: Read Georgia Power's monthly bad debt reports (Docket 42516)
        # Reads any report whose text isn't stored yet (a no-op once all are
        # read), then turns the reports into monthly figures for the
        # Bills and disconnections page.
        if: always()
        run: python -m harvester.run retext 42516 && python -m harvester.household collect
      - name: Rate survey and gas pricing index from the Commission's site
        if: always()
        continue-on-error: true
        run: python -m harvester.household fetch
      - name: Store titles of new dockets
        if: always()
        run: python -m harvester.dockets --max 200
      - name: Read hearing and session dates from the Commission calendar
        if: always()
        run: python -m harvester.calendar
      - name: Rescan meeting agendas and the dockets they list
        if: always()
        run: python -m harvester.agendas
      - name: Tag units, committees, places and disagreements
        if: always()
        run: python -m harvester.tags
      - name: Write the daily digest
        if: always()
        run: python -m harvester.digest
      - name: Save to the record
        # Saves whatever the steps above stored, even when one of them failed,
        # so a failed night loses nothing. A failed harvest is not counted as a
        # finished copy: the site keeps the time of the last run that finished.
        if: always()
        run: scripts/save.sh "Nightly harvest $(date -u +%F)${{ job.status != 'success' && ' (stopped partway)' || '' }}" nightly
      - name: Email docket alerts (only dockets with new filings tonight and at least one follower)
        if: success()
        env:
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
        run: python -m alerts.nightly
