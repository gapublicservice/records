name: Probe the Commission calendar

# Read-only look at how the Commission calendar page lays out its events,
# so the nightly run can collect upcoming hearings. Prints what it finds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show the calendar markup
        run: |
          python3 - <<'PY'
          import re, urllib.request
          UA = {"User-Agent": "gapublicservice-records/1.0 (public records index)"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30) as r:
                  return r.geturl(), r.read().decode("utf-8", "replace")
          base = "https://psc.ga.gov/agendas-calendars/commission-calendar/"
          final, body = get(base)
          print("final:", final, len(body))
          i = body.find("commission-calendar/")
          j = body.find("commission-calendar/", i + 30)
          k = body.find("commission-calendar/", j + 30)
          print("=== around first event links ===")
          print(body[max(0, j - 2500): j + 2500])
          print("=== paging / month links ===")
          for h in sorted(set(re.findall(r'href="([^"]*(?:month|page|date=|\?m=|\?d=)[^"]*)"', body)))[:40]:
              print(" ", h[:160])
          print("=== event links ===")
          for h in sorted(set(re.findall(r'href="([^"]*commission-calendar/[^"]+)"', body))):
              print(" ", h[:200])
          ev = re.findall(r'href="(https?://psc\.ga\.gov/agendas-calendars/commission-calendar/[^"?]+/\?date=\d+)"', body)
          if ev:
              u, page = get(ev[0])
              m = re.search(r"<main.*?</main>", page, re.S)
              txt = (m.group(0) if m else page)
              print("=== one event page:", u, "===")
              print(re.sub(r"\n\s*\n+", "\n", re.sub(r"<script.*?</script>|<style.*?</style>", "", txt, flags=re.S))[:4000])
          PY
