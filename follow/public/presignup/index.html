<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up early · Public Service</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#111;--paper:#fff;--amber:#E8A317;--muted:#555;--line:#ccc}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2f2;--paper:#111;--muted:#b5b5b5;--line:#444}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font:700 30px/1.15 system-ui,sans-serif;margin:0 0 14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-right:8px}
a{color:var(--ink)}
p.muted{color:var(--muted)}
label{display:block;font-weight:600;margin:18px 0 6px}
input[type=email]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
button{margin-top:14px;font:600 17px/1 system-ui,sans-serif;padding:12px 18px;border:0;border-radius:6px;background:var(--amber);color:#111;cursor:pointer}
label.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:16px 0 0}
label.check input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--amber)}
.hp{position:absolute;left:-9999px}
</style></head><body><main>
<p><span class="dot"></span><strong>Public Service</strong> · the record</p>
<h1 id="ps-title">Sign up early</h1>
<p>Sign up now. We'll start emailing you this docket's new filings when Public Service launches.</p>
<form name="presignup" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/presignup-thanks/">
<p class="hp"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
<input type="hidden" name="docket" id="ps-docket">
<label for="ps-email">Email</label>
<input type="email" id="ps-email" name="email" required maxlength="254" autocomplete="email">
<label class="check"><input type="checkbox" name="weekly" value="yes"> Also send me the weekly edition of Public Service.</label>
<button type="submit">Sign up early</button>
</form>
<p><a id="ps-back" href="https://records.gapublicservice.org/">Back to the record</a></p>
<p class="muted">Public Service is an independent project. It is not a product or publication of the Georgia Public Service Commission.</p>
</main>
<script>
(function () {
  var RECORDS = "https://records.gapublicservice.org";
  var d = (new URLSearchParams(location.search).get("docket") || "").trim();
  if (!/^\d{1,6}$/.test(d)) return;
  document.getElementById("ps-docket").value = d;
  document.getElementById("ps-back").href = RECORDS + "/docket/" + d + "/";
  var t = document.getElementById("ps-title");
  t.textContent = "Docket " + d;
  fetch(RECORDS + "/data/docket-titles.json").then(function (r) { return r.json(); }).then(function (all) {
    if (typeof all[d] === "string") t.textContent = "Docket " + d + ": " + all[d];
  }).catch(function () {});
})();
</script>
</body></html>
