<!doctype html><meta charset="utf-8"><title>Calendar event form</title>
<!-- Registers the "calendar-event" form with Netlify Forms. The form people
     fill in is records.gapublicservice.org/submit-event.html, which posts here.
     Field names must match that page. -->
<form name="calendar-event" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/event-thanks/" hidden>
<input name="bot-field"><input name="event"><input name="organizer"><input name="date"><input name="start">
<input name="end"><input name="where"><input name="link"><textarea name="about"></textarea><input name="contact">
</form>
